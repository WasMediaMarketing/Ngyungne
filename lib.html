      }
      .card-header {
        background: linear-gradient(135deg, #8b5cf6, #d946ef);
        color: white;
        padding: 25px;
        border-bottom: none;
      }
      .card-body {
        padding: 35px;
        background-color: #ffffff;
      }
      .btn-download {
        background: linear-gradient(135deg, #f43f5e, #ec4899);

        padding: 16px 32px;
        font-size: 18px;

        border-radius: 12px;
        font-weight: 600;

        box-shadow: 0 8px 20px rgba(244, 63, 94, 0.4);

        {

        },
        {

        {

            "Build high-performance VueJS user interfaces in record time",

          url: "https://quasar.dev/",
        },
        {
          name: "Vuetify",
          description:
            "A Vue UI Library with beautifully handcrafted Material Components",
          uses: "Building material design Vue applications",
          url: "https://vuetifyjs.com/en/",
        },
        {
          name: "Svelte Material UI",
          description: "Material Design components for Svelte",
          uses: "Creating material design Svelte applications",
          url: "https://sveltematerialui.com/",
        },
        {
          name: "Ink",
          description: "React for building command-line interfaces",
          uses: "Creating beautiful command-line interfaces",
          url: "https://github.com/vadimdemedes/ink",
        },
      ];

      document.addEventListener("DOMContentLoaded", function () {
        const generateButton = document.getElementById("generate-pdf");
        const pdfContent = document.getElementById("pdf-content");

        if (generateButton && pdfContent) {
          generateButton.addEventListener("click", generatePDF);
        }

        function generatePDF() {
          const { jsPDF } = window.jspdf;

          // Create a new PDF document
          const doc = new jsPDF("p", "pt", "a4");
          const pageWidth = doc.internal.pageSize.getWidth();
          const pageHeight = doc.internal.pageSize.getHeight();
          const margin = 40;

          // Define ONLY light, vibrant background colors for library entries
          const backgroundColors = [
            [255, 236, 179], // Light Yellow
            [204, 255, 204], // Light Green
            [204, 229, 255], // Light Blue
            [255, 204, 229], // Light Pink
            [255, 204, 204], // Light Red
            [230, 255, 230], // Light Mint
            [230, 230, 255], // Light Lavender
            [255, 222, 179], // Light Orange
            [230, 204, 255], // Light Purple
            [204, 255, 255], // Light Cyan
          ];

          // Define vibrant text colors for headings (no black)
          const textColors = [
            [217, 119, 6], // Yellow-600
            [4, 120, 87], // Green-700
            [29, 78, 216], // Blue-700
            [219, 39, 119], // Pink-600
            [220, 38, 38], // Red-600
            [5, 150, 105], // Emerald-600
            [79, 70, 229], // Indigo-600
            [234, 88, 12], // Orange-600
            [147, 51, 234], // Purple-600
            [3, 105, 161], // Sky-700
          ];

          // Process libraries in groups of 4 per page
          for (let i = 0; i < libraries.length; i += 4) {
            // Add a new page for each group of 4 (except the first page)
            if (i > 0) {
              doc.addPage();
            }

            // Add colorful header to each page - light gradient
            const gradientWidth = pageWidth;
            const gradientHeight = 100;

            // Create light gradient header effect
            for (let x = 0; x < gradientWidth; x += 10) {
              const ratio = x / gradientWidth;
              // Interpolate between light purple and light pink
              const r = Math.floor(230 + (255 - 230) * ratio);
              const g = Math.floor(204 + (204 - 204) * ratio);
              const b = Math.floor(255 + (229 - 255) * ratio);

              doc.setFillColor(r, g, b);
              doc.rect(x, 0, 10, gradientHeight, "F");
            }

            // Add title to each page
            doc.setTextColor(139, 92, 246); // Purple
            doc.setFontSize(24);
            doc.text("React & JavaScript UI Libraries", pageWidth / 2, 40, {
              align: "center",
            });

            // Add subtitle
            doc.setFontSize(14);
            doc.setTextColor(236, 72, 153); // Pink
            doc.text(
              "A colorful collection of popular UI libraries",
              pageWidth / 2,
              65,
              { align: "center" }
            );

            // Add page number
            doc.setFontSize(12);
            doc.setTextColor(79, 70, 229); // Indigo
            doc.text(
              `Page ${Math.floor(i / 4) + 1} of ${Math.ceil(
                libraries.length / 4
              )}`,
              pageWidth / 2,
              85,
              { align: "center" }
            );

            // Process each library in the current group (up to 4)
            const groupEnd = Math.min(i + 4, libraries.length);
            for (let j = i; j < groupEnd; j++) {
              const lib = libraries[j];
              const colorIndex = j % backgroundColors.length;
              const bgColor = backgroundColors[colorIndex];
              const textColor = textColors[colorIndex];

              // Calculate position for this library on the page
              const libraryIndex = j % 4; // 0-3 position on current page
              const yStart = 120 + libraryIndex * 170; // Each library takes 170pt height

              // Add colored background - LIGHT COLORS ONLY
              doc.setFillColor(bgColor[0], bgColor[1], bgColor[2]);
              doc.roundedRect(
                margin,
                yStart,
                pageWidth - margin * 2,
                150,
                8,
                8,
                "F"
              );

              // Add library number and name
              doc.setFontSize(18);
              doc.setTextColor(textColor[0], textColor[1], textColor[2]);
              doc.text(`${j + 1}. ${lib.name}`, margin + 15, yStart + 25);

              // Add horizontal line
              doc.setDrawColor(textColor[0], textColor[1], textColor[2]);
              doc.setLineWidth(1);
              doc.line(
                margin + 15,
                yStart + 35,
                pageWidth - margin - 15,
                yStart + 35
              );

              // Add description - NO BLACK TEXT
              doc.setFontSize(12);
              doc.setTextColor(29, 78, 216); // Blue for description
              const descriptionLines = doc.splitTextToSize(
                lib.description,
                pageWidth - margin * 2 - 30
              );
              doc.text(descriptionLines, margin + 15, yStart + 55);

              // Add uses - NO BLACK TEXT
              doc.setTextColor(147, 51, 234); // Purple for uses
              doc.setFont(undefined, "bold");
              doc.text("Primary Use:", margin + 15, yStart + 85);
              doc.setFont(undefined, "normal");

              const usesText = lib.uses;
              const usesLines = doc.splitTextToSize(
                usesText,
                pageWidth - margin * 2 - 100
              );
              doc.text(usesLines, margin + 100, yStart + 85);

              // Add URL - NO BLACK TEXT
              doc.setTextColor(2, 132, 199); // Link blue
              doc.setFont(undefined, "bold");
              doc.text("Website:", margin + 15, yStart + 115);
              doc.setFont(undefined, "normal");
              doc.text(lib.url, margin + 100, yStart + 115);
            }

            // Add footer - LIGHT COLORS
            doc.setDrawColor(230, 204, 255); // Light purple
            doc.setLineWidth(2);
            doc.line(
              margin,
              pageHeight - 40,
              pageWidth - margin,
              pageHeight - 40
            );

            doc.setFillColor(230, 204, 255); // Light purple
            doc.rect(0, pageHeight - 30, pageWidth, 30, "F");

            doc.setFontSize(10);
            doc.setTextColor(139, 92, 246); // Purple
            doc.text(
              `Page ${Math.floor(i / 4) + 1} of ${Math.ceil(
                libraries.length / 4
              )}`,
              margin,
              pageHeight - 15
            );
          }

          // Save the PDF
          doc.save("40_UI_Libraries_Collection.pdf");
